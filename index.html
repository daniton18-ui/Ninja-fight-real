<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NINJA FIGHT - STREET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12010449" data-sdk="show_12010449"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
body{background:#0a0a0a;color:#fff}
.h{background:#FF6B00;padding:10px;text-align:center}
.g{width:96%;max-width:420px;margin:8px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:80px}
.c{background:#1e1e1e;border:2px solid #FF8C00;border-radius:12px;overflow:hidden}
.c.sel{border-color:#00FF66;box-shadow:0 0 12px #00FF66}
.i{height:90px;background:#000;display:flex;align-items:center;justify-content:center}
.i img{max-width:100%;max-height:90px}
.info{padding:3px;text-align:center;background:#111}
.info b{color:#FF8C00;font-size:9px}
.btm{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;display:flex;gap:8px;z-index:10}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:900}
.btn1{background:#222;color:#FF8C00;border:2px solid #FF8C00}
.btn2{background:#FF6B00;color:#000;border:0}
#pelea{display:none;height:100vh;background:linear-gradient(to bottom,#1a2a4a 0%,#0a0a0a 60%);position:relative}
.sf-top{display:flex;align-items:center;justify-content:space-between;padding:8px;background:#000}
.life{height:22px;background:#333;border:2px solid #fff;flex:1;transform:skewX(-15deg);overflow:hidden}
.life-fill{height:100%;width:100%;transition:width 0.3s}
#v1{background:linear-gradient(90deg,#ffeb00,#ff6b00)}
#v2{background:linear-gradient(90deg,#ff0040,#ff0000)}
.vs{color:#ffeb00;font-size:28px;margin:0 10px;text-shadow:2px 2px 0 #000}
.arena{position:relative;height:58vh;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 20px}
.fighter{width:42%;text-align:center;transition:transform 0.15s}
.fighter img{width:130px;height:160px;object-fit:contain;filter:drop-shadow(0 0 8px #000)}
.fighter.hit{animation:hit 0.3s}
.fighter.att{transform:translateX(40px) scale(1.1)}
#img2.att{transform:translateX(-40px) scale(1.1)}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
.log{position:absolute;top:52%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#ffeb00;padding:8px 20px;border-radius:20px;border:2px solid #ffeb00;font-size:18px;min-width:200px;text-align:center}
.atks{position:absolute;bottom:15px;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
.atk{padding:18px;border-radius:12px;background:linear-gradient(#fff,#ccc);color:#000;font-weight:900;border:3px solid #000;box-shadow:0 4px 0 #000}
.atk:active{transform:translateY(4px);box-shadow:0 0 0 #000}
.nameTag{font-size:12px;color:#0f6;margin-bottom:5px}
.nameTag.e{color:#f44}
</style>
</head>
<body>
<div id="selScreen"><div class="h"><h2>ELIGE TU NINJA - STREET MODE</h2><p id="st" style="font-size:11px">Cargando...</p></div><div class="g" id="grid"></div><div class="btm"><button class="btn btn1" onclick="rand()">ALEATORIO</button><button class="btn btn2" onclick="go()">¡PELEAR!</button></div></div>

<div id="pelea">
<div class="sf-top"><div class="life"><div id="v1" class="life-fill"></div></div><div class="vs">VS</div><div class="life"><div id="v2" class="life-fill"></div></div></div>
<div class="arena">
<div class="fighter" id="f1"><div class="nameTag" id="n1"></div><img id="img1"></div>
<div class="fighter" id="f2"><div class="nameTag e" id="n2"></div><img id="img2" style="transform:scaleX(-1)"></div>
<div class="log" id="log">¡FIGHT!</div>
</div>
<div class="atks"><button class="atk" onclick="atk('golpe')">GOLPE</button><button class="atk" onclick="atk('jutsu')">JUTSU</button><button class="atk" onclick="atk('def')">DEFENSA</button></div>
</div>

<script>
let NINJAS=[],sel=null,ene=null,life1=100,life2=100;
const NAMES={neji:'NEJI',lee:'LEE',sasuke:'SASUKE','072':'SAKURA',shikamaru:'SHIKA',naruto:'NARUTO',jiraiya:'JIRAIYA',anko:'ANKO',kakashi:'KAKASHI',temari:'TEMARI'};
async function load(){
 try{
  let r=await fetch('https://api.github.com/repos/daniton18-ui/Ninja-fight-real/contents');
  let files=await r.json();
  let imgs=files.filter(f=>f.name.match(/\.(jpg|png|jpeg)$/i));
  NINJAS=imgs.map(f=>{
    let low=f.name.toLowerCase();
    let k=Object.keys(NAMES).find(x=>low.includes(x));
    return {n:k?NAMES[k]:f.name.slice(0,6).toUpperCase(),f:f.name};
  });
  document.getElementById('st').innerText=NINJAS.length+' NINJAS LISTOS';
 }catch(e){
  NINJAS=[
   {n:'NEJI',f:'0d7e5-1_neji004.jpg'},{n:'LEE',f:'15451-rock-lee-19.jpg'},{n:'SAKURA',f:'47c62-072.jpg'},{n:'NARUTO',f:'6b8b8-naruto-5.png'},
   {n:'SASUKE',f:'89e7e-sasuke.png'},{n:'SHIKA',f:'shika.jpg'},{n:'JIRAIYA',f:'jiraiya.jpg'},{n:'ANKO',f:'anko.jpg'},{n:'KAKASHI',f:'kakashi.jpg'},{n:'TEMARI',f:'temari.jpg'}
  ];
  document.getElementById('st').innerText='10 NINJAS MODO LOCAL';
 }
 build();
}
function build(){let g=document.getElementById('grid');g.innerHTML='';NINJAS.forEach((n,i)=>{let d=document.createElement('div');d.className='c';d.id='c-'+i;d.innerHTML=`<div class="i"><img src="${n.f}" onerror="this.style.display='none'"></div><div class="info"><b>${n.n}</b></div>`;d.onclick=()=>pick(i);g.appendChild(d);});}
function pick(i){document.querySelectorAll('.c').forEach(x=>x.classList.remove('sel'));document.getElementById('c-'+i).classList.add('sel');sel=NINJAS[i];}
function rand(){if(!NINJAS.length)return;pick(Math.floor(Math.random()*NINJAS.length));}
function go(){
 if(!sel){alert('Toca un ninja, que se ponga verde');return;}
 let otros=NINJAS.filter((x,idx)=> idx !== NINJAS.indexOf(sel));
 if(otros.length===0) otros=NINJAS;
 ene=otros[Math.floor(Math.random()*otros.length)];
 document.getElementById('selScreen').style.display='none';
 document.getElementById('pelea').style.display='block';
 document.getElementById('n1').innerText=sel.n;
 document.getElementById('n2').innerText=ene.n;
 document.getElementById('img1').src=sel.f;
 document.getElementById('img2').src=ene.f;
 life1=100;life2=100;up();
}
function atk(t){
 let f1=document.getElementById('f1'),f2=document.getElementById('f2');
 if(t==='golpe'){f1.classList.add('att');setTimeout(()=>f1.classList.remove('att'),200);life2-=15;document.getElementById('log').innerText='GOLPE -15';f2.classList.add('hit');setTimeout(()=>f2.classList.remove('hit'),300);}
 if(t==='jutsu'){f1.classList.add('att');setTimeout(()=>f1.classList.remove('att'),200);life2-=28;document.getElementById('log').innerText='JUTSU -28';f2.classList.add('hit');setTimeout(()=>f2.classList.remove('hit'),300);}
 if(t==='def'){life1=Math.min(100,life1+15);document.getElementById('log').innerText='DEFENSA +15';up();setTimeout(eTurn,500);return;}
 if(life2<0)life2=0;up();if(life2<=0){document.getElementById('log').innerText='GANASTE!';setTimeout(()=>location.reload(),1500);return;}setTimeout(eTurn,600);
}
function eTurn(){
 let f1=document.getElementById('f1'),f2=document.getElementById('f2');
 f2.classList.add('att');setTimeout(()=>f2.classList.remove('att'),200);
 life1-=15;if(life1<0)life1=0;document.getElementById('log').innerText+=' | Enemigo -15';f1.classList.add('hit');setTimeout(()=>f1.classList.remove('hit'),300);
 up();if(life1<=0){document.getElementById('log').innerText='PERDISTE';setTimeout(()=>location.reload(),1500);}
}
function up(){document.getElementById('v1').style.width=life1+'%';document.getElementById('v2').style.width=life2+'%';}
load();
</script>
</body>
</html>
