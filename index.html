<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ninja Road: Street Fighter</title>
    <!-- SDKs CORREGIDOS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            margin: 0; padding: 0;
            overflow: hidden;
        }
        #menu-screen {
            padding: 20px; box-sizing: border-box;
            height: 100vh; display: flex;
            flex-direction: column;
            justify-content: center; align-items: center;
        }
        .stats-container {
            background: #2d2d2d; border: 2px solid #ff4757;
            padding: 15px; border-radius: 10px;
            margin-bottom: 20px; width: 80%; max-width: 300px;
        }
        .btn {
            background-color: #ff4757; color: white; border: none;
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin: 10px;
            width: 80%; max-width: 300px;
            box-shadow: 0 4px #ff2e44;
        }
        .btn:active { box-shadow: 0 0px; transform: translateY(4px); }
        #game-container { display: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>🥷 NINJA ROAD 🥷</h1>
        <div class="stats-container">
            <h3>Ninja: <span id="ninja-name">Cargando...</span></h3>
            <p>⭐ Nivel: <span id="ninja-level">1</span> (<span id="ninja-xp">0</span>/100 XP)</p>
            <p>🪙 Monedas: <span id="ninja-coins">20</span></p>
        </div>
        <button class="btn" onclick="startFight()">🥊 PELEAR (VS IA)</button>
    </div>

    <div id="game-container"></div>

<script>
    const tg = window.Telegram?.WebApp;
    if(tg){ tg.expand(); tg.ready(); }

    let playerState = {
        name: tg?.initDataUnsafe?.user?.first_name || "Ninja",
        level: 1, xp: 0, coins: 20
    };

    function updateUI() {
        document.getElementById('ninja-name').innerText = playerState.name;
        document.getElementById('ninja-level').innerText = playerState.level;
        document.getElementById('ninja-xp').innerText = playerState.xp;
        document.getElementById('ninja-coins').innerText = playerState.coins;
    }
    updateUI();

    function startFight() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        initPhaserGame();
    }

    function initPhaserGame() {
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            physics: { default: 'arcade', arcade: { gravity: { y: 800 }, debug: false } },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);
        let player, enemy, ground;
        let playerHealth = 100, enemyHealth = 100;
        let playerHealthBar, enemyHealthBar;
        let moveLeft = false, moveRight = false;
        let isAttacking = false;
        let cursors;

        function preload() {
            // YA NO CARGAMOS IMÁGENES ROTAS, TODO SE DIBUJA CON CÓDIGO
        }

        function create() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;

            // Fondo con degradado
            this.add.rectangle(w/2, h/2, w, h, 0x1a1a2e);
            this.add.rectangle(w/2, h*0.3, w, h*0.6, 0x16213e);

            // Suelo
            ground = this.add.rectangle(w/2, h-50, w, 100, 0x2d2d2d);
            this.physics.add.existing(ground, true);

            // Jugador - rectángulo azul
            player = this.add.rectangle(w*0.25, h-150, 40, 60, 0x3498db);
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(true);
            player.body.setSize(40,60);

            // Enemigo - rectángulo rojo
            enemy = this.add.rectangle(w*0.75, h-150, 40, 60, 0xe74c3c);
            this.physics.add.existing(enemy);
            enemy.body.setCollideWorldBounds(true);
            enemy.body.setSize(40,60);

            this.physics.add.collider(player, ground);
            this.physics.add.collider(enemy, ground);

            // Barras de vida
            playerHealthBar = this.add.graphics();
            enemyHealthBar = this.add.graphics();

            this.add.text(20, 20, playerState.name.toUpperCase(), { font: 'bold 16px Arial', fill: '#3498db' });
            this.add.text(w-120, 20, 'IA NINJA', { font: 'bold 16px Arial', fill: '#e74c3c' });

            // Controles táctiles
            let btnLeft = this.add.text(40, h-70, '◀', { font: '48px Arial', fill: '#fff' }).setInteractive();
            btnLeft.on('pointerdown', () => moveLeft = true);
            btnLeft.on('pointerup', () => { moveLeft = false; player.body.setVelocityX(0); });
            btnLeft.on('pointerout', () => { moveLeft = false; player.body.setVelocityX(0); });

            let btnRight = this.add.text(140, h-70, '▶', { font: '48px Arial', fill: '#fff' }).setInteractive();
            btnRight.on('pointerdown', () => moveRight = true);
            btnRight.on('pointerup', () => { moveRight = false; player.body.setVelocityX(0); });
            btnRight.on('pointerout', () => { moveRight = false; player.body.setVelocityX(0); });

            let btnPunch = this.add.text(w-100, h-70, '🥊', { font: '48px Arial' }).setInteractive();
            btnPunch.on('pointerdown', () => doPunch.call(this));

            cursors = this.input.keyboard.createCursorKeys();
            this.input.keyboard.on('keydown-SPACE', () => doPunch.call(this));
        }

        function doPunch() {
            if (isAttacking) return;
            isAttacking = true;
            player.fillColor = 0xffffff;
            let dist = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
            if (dist < 70) {
                enemyHealth -= 15;
                enemy.fillColor = 0xff0000;
                this.time.delayedCall(150, () => enemy.fillColor = 0xe74c3c);
                enemy.x += (enemy.x > player.x ? 15 : -15);
            }
            this.time.delayedCall(250, () => {
                player.fillColor = 0x3498db;
                isAttacking = false;
            });
        }

        function update() {
            if (playerHealth <=0 || enemyHealth <=0) return;

            if (moveLeft || cursors.left.isDown) {
                player.body.setVelocityX(-200);
            } else if (moveRight || cursors.right.isDown) {
                player.body.setVelocityX(200);
            } else {
                player.body.setVelocityX(0);
            }

            // IA simple
            if (enemyHealth > 0) {
                if (enemy.x > player.x + 55) enemy.body.setVelocityX(-90);
                else if (enemy.x < player.x - 55) enemy.body.setVelocityX(90);
                else {
                    enemy.body.setVelocityX(0);
                    if (Phaser.Math.Between(1,40) === 5) {
                        playerHealth -= 8;
                        player.fillColor = 0xff0000;
                        this.time.delayedCall(150, () => player.fillColor = 0x3498db);
                        player.x += (player.x < enemy.x ? -12 : 12);
                    }
                }
            }

            playerHealthBar.clear();
            playerHealthBar.fillStyle(0x2ed573, 1);
            playerHealthBar.fillRect(20, 45, Math.max(0,playerHealth)*1.5, 15);
            enemyHealthBar.clear();
            enemyHealthBar.fillStyle(0xff4757, 1);
            enemyHealthBar.fillRect(window.innerWidth-170, 45, Math.max(0,enemyHealth)*1.5, 15);

            if (enemyHealth <=0 || playerHealth <=0) {
                this.physics.pause();
                let won = enemyHealth <=0;
                if(won){
                    playerState.xp+=35; playerState.coins+=15;
                    if(playerState.xp>=100){playerState.level++; playerState.xp=0;}
                }
                this.add.text(this.cameras.main.width/2 -110, this.cameras.main.height/2, won?"¡VICTORIA!":"K.O. PERDISTE", { font:'bold 28px Arial', fill:'#fff', backgroundColor:'#000', padding:{x:10,y:6} });
                this.time.delayedCall(2500, () => {
                    game.destroy(true);
                    document.getElementById('game-container').style.display='none';
                    document.getElementById('menu-screen').style.display='flex';
                    updateUI();
                });
            }
        }
    }
</script>
</body>
</html>
