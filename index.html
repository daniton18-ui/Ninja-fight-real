<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NINJA 2D REAL - FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:Arial Black}
canvas{background:linear-gradient(#2a4a8a,#111);border:3px solid #FF6B00;border-radius:10px}
.controls{display:flex;gap:10px;margin-top:10px}
.btn{width:70px;height:70px;background:#222;border:2px solid #FF6B00;border-radius:15px;color:#FF6B00;font-weight:900;font-size:22px;user-select:none}
.btn:active{background:#FF6B00;color:#000}
.btn-jump{background:#111;border-color:#00ff66;color:#00ff66;width:90px}
.top{color:#ffeb00;padding:5px}
.life{width:300px;height:18px;background:#333;border:2px solid #fff;display:flex}
#v1{height:100%;background:#ffeb00;width:100%;transition:width 0.2s}
#v2{height:100%;background:#ff0000;width:100%;transition:width 0.2s}
</style>
</head>
<body>
<div class="top">NINJA 2D - CAMINA Y SALTA</div>
<div class="life"><div id="v1"></div><div id="v2"></div></div>
<canvas id="game" width="380" height="260"></canvas>
<div class="controls">
<button class="btn" id="left">◀</button>
<button class="btn btn-jump" id="jump">SALTO</button>
<button class="btn" id="attack">GOLPE</button>
<button class="btn" id="right">▶</button>
</div>

<script>
const canvas=document.getElementById('game')
const ctx=canvas.getContext('2d')
let keys={}

let imgPlayer=new Image()
let imgEnemy=new Image()
imgPlayer.src='0d7e5-1_neji004.jpg'
imgEnemy.src='15451-rock-lee-19.jpg'
let imgPlayerOk=true, imgEnemyOk=true
imgPlayer.onerror=()=>imgPlayerOk=false
imgEnemy.onerror=()=>imgEnemyOk=false

let player={x:30,y:180,w:50,h:60,vx:0,vy:0,onGround:false,dir:1,attacking:0,life:100}
let enemy={x:280,y:180,w:50,h:60,vx:0,life:100,cooldown:0}
let gravity=0.65

let leftDown=false,rightDown=false,jumpPressed=false

function update(){
  if(keys['a'] || keys['ArrowLeft'] || leftDown){player.vx=-3.5;player.dir=-1}
  else if(keys['d'] || keys['ArrowRight'] || rightDown){player.vx=3.5;player.dir=1}
  else player.vx*=0.8

  if((keys['w'] || keys[' '] || keys['ArrowUp'] || jumpPressed) && player.onGround){
    player.vy=-12
    player.onGround=false
  }
  jumpPressed=false

  player.vy+=gravity
  player.x+=player.vx
  player.y+=player.vy

  if(player.y+player.h >= 240){player.y=240-player.h;player.vy=0;player.onGround=true}
  if(player.x<0) player.x=0
  if(player.x>330) player.x=330

  if(enemy.cooldown<=0){
    let diff=player.x-enemy.x
    if(Math.abs(diff)>5) enemy.vx=Math.sign(diff)*1.5
    else enemy.vx=0
    enemy.x+=enemy.vx
  }else enemy.cooldown--

  if(player.attacking>0){
    player.attacking--
    let hitX=player.dir==1 ? player.x+player.w : player.x-40
    if(hitX < enemy.x+enemy.w && hitX+40 > enemy.x && player.y+15 < enemy.y+enemy.h && player.y+40 > enemy.y){
       enemy.life-=1.2
       if(enemy.life<0) enemy.life=0
       enemy.cooldown=15
       enemy.x+=player.dir*6
    }
  }

  if(Math.abs(enemy.x-player.x)<48 && Math.random()<0.025 && enemy.cooldown<=0){
    player.life-=10
    if(player.life<0) player.life=0
    enemy.cooldown=50
    player.x+= (player.x<enemy.x?-12:12)
  }
}

function drawPlayer(x,y,w,h,dir,ok,img){
  if(ok && img.complete && img.naturalWidth>0){
    ctx.save()
    if(dir==-1){ctx.scale(-1,1);ctx.drawImage(img,-x-w,y,w,h)}
    else ctx.drawImage(img,x,y,w,h)
    ctx.restore()
  }else{
    ctx.fillStyle='#FF8C00'
    ctx.fillRect(x,y,w,h)
    ctx.fillStyle='#000'
    ctx.fillRect(x+10,y+10,10,10)
    ctx.fillRect(x+30,y+10,10,10)
  }
}

function draw(){
  ctx.clearRect(0,0,380,260)
  ctx.fillStyle='#442200'
  ctx.fillRect(0,240,380,20)

  drawPlayer(player.x,player.y,player.w,player.h,player.dir,imgPlayerOk,imgPlayer)

  if(player.attacking>0){
    ctx.fillStyle='rgba(0,255,0,0.55)'
    let hx=player.dir==1?player.x+player.w:player.x-40
    ctx.fillRect(hx,player.y+15,40,25)
  }

  drawPlayer(enemy.x,enemy.y,enemy.w,enemy.h,1,imgEnemyOk,imgEnemy)

  ctx.strokeStyle='rgba(255,0,0,0.5)'
  ctx.strokeRect(enemy.x,enemy.y,enemy.w,enemy.h)

  document.getElementById('v1').style.width=player.life+'%'
  document.getElementById('v2').style.width=enemy.life+'%'

  if(player.life<=0 || enemy.life<=0){
    ctx.fillStyle='yellow'
    ctx.font='bold 28px Arial'
    ctx.fillText(player.life<=0?'PERDISTE':'GANASTE!',100,120)
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop()

window.addEventListener('keydown', e=>{
  keys[e.key]=true
  if(e.code==='Space') player.attacking=18
})
window.addEventListener('keyup', e=>keys[e.key]=false)

function bind(id, down, up){
  let el=document.getElementById(id)
  el.addEventListener('touchstart', e=>{e.preventDefault();down()}, {passive:false})
  el.addEventListener('touchend', e=>{e.preventDefault();up()}, {passive:false})
  el.addEventListener('mousedown', down)
  el.addEventListener('mouseup', up)
}
bind('left', ()=>leftDown=true, ()=>leftDown=false)
bind('right', ()=>rightDown=true, ()=>rightDown=false)
bind('jump', ()=>jumpPressed=true, ()=>{})
bind('attack', ()=>player.attacking=18, ()=>{})
</script>
</body>
</html>
